<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Unser Date 📅</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --card: rgba(255, 255, 255, 0.94);
    --text: #3d2a2c;
    --muted: #7a6264;
    --accent: #c8384a;
    --accent-dark: #a82a3b;
    --soft: #fbeeea;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: 'Fredoka', system-ui, sans-serif;
    color: var(--text);
    background: #efe6dc;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
  }
  .card {
    background: var(--card);
    width: 100%; max-width: 440px;
    border-radius: 28px;
    padding: 32px 24px;
    box-shadow: 0 18px 50px rgba(61, 42, 44, .25);
    text-align: center;
  }
  .emoji { font-size: 64px; line-height: 1; margin-bottom: 12px; }
  h1 { font-size: 24px; font-weight: 600; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 8px; font-size: 16px; }
  .error { color: var(--accent-dark); margin-top: 12px; }
  button {
    font-family: inherit; font-size: 18px; font-weight: 500;
    border: none; border-radius: 999px; padding: 14px 30px;
    background: var(--accent); color: #fff; width: 100%; margin-top: 22px;
    cursor: pointer;
  }
  button:hover { background: var(--accent-dark); }
  .cal-link { display: block; margin-top: 14px; color: var(--accent-dark); font-size: 15px; text-decoration: underline; }
</style>
</head>
<body>

<main class="card">
  <div class="emoji">📅</div>
  <h1 id="title">Unser Date</h1>
  <p id="when"></p>
  <button id="addBtn">🍎 Zum Apple Kalender hinzufügen</button>
  <a class="cal-link" id="gcalLink" target="_blank" rel="noopener" hidden>oder in Google Kalender speichern</a>
  <p class="error" id="error"></p>
</main>

<script src="calendar.js"></script>
<script>
  const state = DateCalendar.stateFromQuery(location.search);
  const addBtn = document.getElementById("addBtn");

  if (!state) {
    addBtn.hidden = true;
    document.getElementById("error").textContent = "Dieser Kalender-Link ist leider nicht vollständig 🙈";
  } else {
    const [y, m, d] = state.date.split("-").map(Number);
    const day = new Date(y, m - 1, d).toLocaleDateString("de-DE", {
      weekday: "long", day: "numeric", month: "long", year: "numeric"
    });
    document.getElementById("title").textContent = DateCalendar.eventData(state).title;
    document.getElementById("when").textContent = day + ", " + state.time;
    const gcal = document.getElementById("gcalLink");
    gcal.href = DateCalendar.gcalUrl(state);
    gcal.hidden = false;
    addBtn.addEventListener("click", () => DateCalendar.downloadIcs(state, document));
  }
</script>
</body>
</html>
